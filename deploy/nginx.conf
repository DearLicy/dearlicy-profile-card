server {
    listen 443 ssl;
    http2 on;
    server_name profile.akucb.com;

    ssl_certificate /etc/letsencrypt/live/profile.akucb.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/profile.akucb.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:profile_card_ssl:10m;
    ssl_session_timeout 1d;

    access_log /www/wwwlogs/profile.akucb.com.log;
    error_log /www/wwwlogs/profile.akucb.com.error.log;

    client_max_body_size 1m;
    client_header_buffer_size 32k;
    large_client_header_buffers 4 64k;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;

    location / {
        proxy_pass http://127.0.0.1:3410;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }
}

server {
    listen 80;
    server_name profile.akucb.com;
    root /www/wwwroot/dearlicy-profile-card/acme;
    location ^~ /.well-known/acme-challenge/ { try_files $uri =404; }
    location / { return 301 https://$host$request_uri; }
}
