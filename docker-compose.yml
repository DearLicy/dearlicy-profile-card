services:
  profile-card:
    build: .
    container_name: profile-card
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:3410:3410"
    environment:
      NODE_ENV: production
      PORT: 3410
      HOSTNAME: 0.0.0.0
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD must be set}
    volumes:
      - ./data:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
